<link rel="stylesheet" href="assets/css/base.css">

  <style>
    :root {
      --teal: #005b5b;
      --gold: #c88b24;
      --cream: #fff9ef;
      --text: #264645;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;

      background:
        radial-gradient(circle at 15% 15%, rgba(0,108,107,.07), transparent 28rem),
        radial-gradient(circle at 85% 80%, rgba(200,139,36,.10), transparent 30rem),
        linear-gradient(135deg, #fff, var(--cream));

      color: var(--text);
    }

    .error-card {
      width: min(100%, 620px);
      padding: clamp(38px, 7vw, 72px) clamp(24px, 7vw, 64px);
      text-align: center;

      border: 1px solid rgba(200,139,36,.32);
      border-radius: 30px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.92),
          rgba(255,248,235,.76),
          rgba(220,240,239,.34)
        );

      box-shadow:
        0 24px 70px rgba(56,43,22,.10),
        inset 0 1px 0 rgba(255,255,255,.95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .error-code {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(5rem, 18vw, 9rem);
      line-height: .85;
      font-weight: 400;
      color: var(--teal);
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 28px auto;
    }

    .ornament::before,
    .ornament::after {
      content: "";
      width: 58px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .ornament::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .ornament span {
      color: var(--gold);
      font-size: 1rem;
    }

    h1 {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.65rem, 5vw, 2.35rem);
      font-weight: 400;
      color: var(--teal);
    }

    p {
      margin: 0 auto 30px;
      max-width: 430px;
      line-height: 1.65;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      min-height: 52px;
      padding: 0 28px;

      border: 1px solid var(--gold);
      border-radius: 999px;

      color: var(--teal);
      background: rgba(255,255,255,.72);

      text-decoration: none;
      font-weight: 600;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .home-link:hover {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 10px 28px rgba(0,91,91,.10);
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .error-card {
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="error-card">
    <p class="error-code">404</p>

    <div class="ornament" aria-hidden="true">
      <span>◇</span>
    </div>

    <h1>Seite nicht gefunden</h1>

    <p>
      Die gewünschte Seite konnte leider nicht gefunden werden.
      Kehren Sie zu den rechtlichen Informationen zurück.
    </p>

    <a class="home-link" href="index.html">
      <span aria-hidden="true">←</span>
      Zur Startseite
    </a>
  </main>

</body>
</html>
